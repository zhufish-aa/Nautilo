<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="鹈鹕骑自行车">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>

  <!-- 天空背景 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="130" cy="110" r="90" fill="url(#sun)"/>
  <circle cx="130" cy="110" r="45" fill="#ffd54f"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="600" cy="90" rx="50" ry="18"/>
    <ellipse cx="650" cy="80" rx="35" ry="14"/>
    <ellipse cx="560" cy="95" rx="30" ry="12"/>
    <ellipse cx="300" cy="130" rx="40" ry="14"/>
    <ellipse cx="345" cy="122" rx="28" ry="11"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="556" width="800" height="44" fill="#c5e1a5"/>
  <rect x="0" y="556" width="800" height="6" fill="#aed581"/>

  <!-- 动感线条（表示前进） -->
  <g stroke="#90caf9" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M 60 300 C 90 300 110 305 130 315"/>
    <path d="M 40 340 C 80 340 110 348 140 360"/>
    <path d="M 70 380 C 100 380 125 388 150 398"/>
  </g>

  <!-- 后轮 -->
  <g>
    <circle cx="230" cy="470" r="85" fill="none" stroke="#37474f" stroke-width="14"/>
    <circle cx="230" cy="470" r="78" fill="none" stroke="#90a4ae" stroke-width="3"/>
    <g stroke="#78909c" stroke-width="3">
      <line x1="230" y1="395" x2="230" y2="545"/>
      <line x1="155" y1="470" x2="305" y2="470"/>
      <line x1="177" y1="417" x2="283" y2="523"/>
      <line x1="283" y1="417" x2="177" y2="523"/>
    </g>
    <circle cx="230" cy="470" r="10" fill="#546e7a"/>
  </g>

  <!-- 前轮 -->
  <g>
    <circle cx="570" cy="470" r="85" fill="none" stroke="#37474f" stroke-width="14"/>
    <circle cx="570" cy="470" r="78" fill="none" stroke="#90a4ae" stroke-width="3"/>
    <g stroke="#78909c" stroke-width="3">
      <line x1="570" y1="395" x2="570" y2="545"/>
      <line x1="495" y1="470" x2="645" y2="470"/>
      <line x1="517" y1="417" x2="623" y2="523"/>
      <line x1="623" y1="417" x2="517" y2="523"/>
    </g>
    <circle cx="570" cy="470" r="10" fill="#546e7a"/>
  </g>

  <!-- 车架 -->
  <g stroke="#e53935" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="230" y1="470" x2="400" y2="452"/>
    <line x1="230" y1="470" x2="330" y2="312"/>
    <line x1="330" y1="312" x2="400" y2="452"/>
    <line x1="400" y1="452" x2="545" y2="322"/>
    <line x1="330" y1="312" x2="545" y2="322"/>
  </g>
  <!-- 前叉 -->
  <path d="M 545 322 C 550 360 560 420 570 470" stroke="#c62828" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- 座管 + 座垫 -->
  <line x1="330" y1="312" x2="332" y2="292" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
  <path d="M 292 292 Q 330 282 372 294 Q 332 304 292 292 Z" fill="#5d4037"/>
  <path d="M 332 294 Q 350 288 366 292" stroke="#8d6e63" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 车把 -->
  <line x1="545" y1="322" x2="548" y2="296" stroke="#c62828" stroke-width="9" stroke-linecap="round"/>
  <path d="M 500 302 Q 548 288 596 302" stroke="#37474f" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M 500 302 L 506 312" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>
  <path d="M 590 302 L 584 312" stroke="#37474f" stroke-width="8" stroke-linecap="round"/>

  <!-- 曲柄 + 脚踏 -->
  <g stroke="#37474f" stroke-width="8" stroke-linecap="round">
    <line x1="400" y1="452" x2="400" y2="418"/>
    <line x1="400" y1="452" x2="400" y2="486"/>
  </g>
  <circle cx="400" cy="452" r="14" fill="#546e7a"/>
  <rect x="378" y="410" width="44" height="10" rx="5" fill="#37474f"/>
  <rect x="378" y="478" width="44" height="10" rx="5" fill="#37474f"/>

  <!-- 链条示意 -->
  <path d="M 230 500 Q 315 500 400 480" stroke="#78909c" stroke-width="3" fill="none" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- 鹈鹕腿 -->
  <g stroke="#f57c00" stroke-width="11" stroke-linecap="round">
    <path d="M 318 296 C 330 350 370 395 400 418"/>
    <path d="M 336 300 C 355 360 385 420 400 478"/>
  </g>
  <!-- 蹼足（踩在脚踏上） -->
  <g fill="#f57c00">
    <path d="M 386 412 L 424 410 L 420 424 L 400 420 Z"/>
    <path d="M 386 482 L 424 480 L 420 494 L 400 490 Z"/>
  </g>

  <!-- 鹈鹕 -->
  <g>
    <!-- 尾巴 -->
    <path d="M 262 268 L 220 258 L 252 282 Z" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 258 280 L 216 276 L 250 296 Z" fill="#eeeeee" stroke="#e0e0e0" stroke-width="2" stroke-linejoin="round"/>

    <!-- 身体 -->
    <ellipse cx="330" cy="248" rx="82" ry="58" fill="#ffffff" stroke="#e0e0e0" stroke-width="2.5"/>

    <!-- 展开的翅膀（带黑色飞羽） -->
    <path d="M 320 228 C 290 160 240 128 214 148 C 230 168 244 190 252 208 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 228 142 C 238 160 248 178 254 196 L 268 168 Z" fill="#37474f"/>
    <path d="M 214 148 C 222 156 228 166 232 176 L 244 150 Z" fill="#37474f"/>

    <!-- 脖子 -->
    <path d="M 372 218 C 400 172 424 180 442 178" stroke="#ffffff" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M 372 218 C 400 172 424 180 442 178" stroke="#e0e0e0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- 头 -->
    <circle cx="452" cy="172" r="32" fill="#ffffff" stroke="#e0e0e0" stroke-width="2.5"/>

    <!-- 脑后羽毛 -->
    <path d="M 430 148 Q 424 128 440 134" stroke="#f5f5f5" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 436 154 Q 428 138 448 140" stroke="#f5f5f5" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- 眼睛 -->
    <circle cx="446" cy="164" r="5" fill="#263238"/>
    <circle cx="444" cy="162" r="1.8" fill="#ffffff"/>

    <!-- 上喙 -->
    <path d="M 474 160 C 520 148 572 142 618 140 L 614 152 C 570 156 522 162 478 172 Z" fill="#ffb300" stroke="#ef6c00" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 喉囊 -->
    <path d="M 478 172 C 500 206 555 196 596 162 Z" fill="#ffcc80" stroke="#ef6c00" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 492 186 C 520 196 560 188 584 170" stroke="#fb8c00" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- 小鱼从喉囊跃出 -->
    <g transform="translate(632 118) rotate(-30)">
      <ellipse cx="0" cy="0" rx="14" ry="7" fill="#ff8f00"/>
      <path d="M 12 0 L 22 -8 L 22 8 Z" fill="#ff8f00"/>
      <circle cx="-6" cy="-2" r="1.6" fill="#263238"/>
    </g>
    <path d="M 620 150 Q 628 140 626 130" stroke="#90caf9" stroke-width="2" fill="none" opacity="0.7"/>

    <!-- 红色围巾（随风飘） -->
    <path d="M 352 286 C 380 282 398 288 408 302" stroke="#e53935" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 408 302 C 420 318 416 340 404 356" stroke="#e53935" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 404 356 L 398 366 L 410 364 Z" fill="#e53935"/>
  </g>

  <!-- 车轮阴影 -->
  <ellipse cx="230" cy="562" rx="80" ry="8" fill="#9ccc65" opacity="0.7"/>
  <ellipse cx="570" cy="562" rx="80" ry="8" fill="#9ccc65" opacity="0.7"/>
</svg>
