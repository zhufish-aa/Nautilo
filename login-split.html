<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nautilo · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    min-height: 100vh;
    background: #fff;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 左栏：品牌视觉 ============ */
  .side {
    flex: 1.15;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 44px 52px;
    background: linear-gradient(150deg, #4f46e5 0%, #7c3aed 45%, #c026d3 100%);
    color: #fff;
  }
  .side::before {
    content: "";
    position: absolute;
    width: 640px; height: 640px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.16);
    right: -220px; top: -180px;
  }
  .side::after {
    content: "";
    position: absolute;
    width: 420px; height: 420px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.12);
    right: -80px; top: -60px;
  }
  .ring3 {
    position: absolute;
    width: 900px; height: 900px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.08);
    right: -420px; top: -360px;
  }
  .ring4 {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    left: -90px; bottom: -90px;
    filter: blur(2px);
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,255,255,.06));
    animation: float 7s ease-in-out infinite;
  }
  .bubble.b1 { width: 14px; height: 14px; left: 18%; bottom: 32%; }
  .bubble.b2 { width: 8px; height: 8px; left: 30%; bottom: 46%; animation-delay: -2.5s; animation-duration: 9s; }
  .bubble.b3 { width: 20px; height: 20px; right: 22%; bottom: 24%; animation-delay: -5s; animation-duration: 8s; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-26px); }
  }

  .side .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: 3px;
    position: relative; z-index: 2;
  }
  .side .logo .mark {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    backdrop-filter: blur(6px);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 800;
  }

  .side .hero { position: relative; z-index: 2; max-width: 460px; }
  .side .hero h2 {
    font-size: 34px;
    font-weight: 750;
    line-height: 1.35;
    letter-spacing: .5px;
    margin-bottom: 16px;
  }
  .side .hero p { font-size: 14.5px; line-height: 1.8; color: rgba(255,255,255,.75); }

  .feats { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px; }
  .feat {
    display: flex; align-items: center; gap: 12px;
    font-size: 13.5px;
    color: rgba(255,255,255,.85);
  }
  .feat .tick {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.3);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .feat .tick svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .side .footnote { position: relative; z-index: 2; font-size: 11.5px; color: rgba(255,255,255,.55); letter-spacing: .5px; }

  /* ============ 右栏：表单 ============ */
  .form-side {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 40px 24px;
    background: #fff;
  }
  .form-box { width: min(360px, 100%); }

  .mobile-brand { display: none; text-align: center; margin-bottom: 30px; }
  .mobile-brand .mark {
    width: 48px; height: 48px;
    margin: 0 auto 12px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4f46e5, #c026d3);
    display: grid; place-items: center;
    color: #fff; font-size: 21px; font-weight: 800;
    box-shadow: 0 12px 30px -8px rgba(79,70,229,.5);
  }

  .head { margin-bottom: 30px; }
  .head h1 { font-size: 26px; font-weight: 750; letter-spacing: -.3px; }
  .head p { margin-top: 8px; font-size: 14px; color: #64748b; }

  .field { position: relative; margin-bottom: 16px; }
  .field input {
    width: 100%; height: 50px;
    padding: 0 42px 0 44px;
    font-size: 14.5px;
    color: #0f172a;
    background: #f8fafc;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .field input::placeholder { color: #94a3b8; }
  .field input:focus { background: #fff; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.12); }
  .icon {
    position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: #94a3b8; pointer-events: none;
    transition: color .2s;
  }
  .field input:focus ~ .icon { color: #6366f1; }
  .eye {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: #94a3b8; padding: 8px; border-radius: 8px;
    transition: color .2s, background .2s;
  }
  .eye:hover { color: #475569; background: #f1f5f9; }

  .strength { display: flex; gap: 5px; margin: -8px 2px 16px; height: 3px; opacity: 0; transition: opacity .3s; }
  .strength.show { opacity: 1; }
  .strength i { flex: 1; border-radius: 99px; background: #e2e8f0; transition: background .3s; }
  .strength i.on { background: currentColor; }

  .row { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 22px; font-size: 13px; }
  .check { display: flex; align-items: center; gap: 8px; color: #475569; cursor: pointer; user-select: none; }
  .check input { display: none; }
  .box {
    width: 17px; height: 17px;
    border-radius: 5.5px;
    border: 1.5px solid #cbd5e1;
    background: #fff;
    display: grid; place-items: center;
    transition: all .2s;
  }
  .check input:checked + .box { background: linear-gradient(135deg, #6366f1, #a855f7); border-color: transparent; box-shadow: 0 3px 10px -2px rgba(99,102,241,.5); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .box svg { width: 10px; height: 10px; opacity: 0; transform: scale(.4); transition: all .18s; }
  .forgot { color: #6366f1; text-decoration: none; font-weight: 600; transition: opacity .2s; }
  .forgot:hover { opacity: .75; }

  .btn {
    position: relative;
    width: 100%; height: 50px;
    border: none; border-radius: 12px;
    font-size: 15px; font-weight: 650; letter-spacing: 2px;
    color: #fff;
    cursor: pointer; overflow: hidden;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 12px 28px -10px rgba(99,102,241,.55);
    transition: transform .15s, box-shadow .25s, filter .25s;
  }
  .btn:hover { transform: translateY(-1.5px); box-shadow: 0 18px 36px -12px rgba(99,102,241,.6); filter: brightness(1.05); }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.4); transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none; }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  .btn.loading { pointer-events: none; }
  .btn .spinner { display: none; width: 20px; height: 20px; margin: 0 auto; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  .btn.loading .spinner { display: block; }
  .btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider { display: flex; align-items: center; gap: 14px; margin: 24px 0 18px; color: #94a3b8; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }

  .socials { display: flex; gap: 10px; }
  .social {
    flex: 1; height: 46px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    color: #475569; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .social:hover { border-color: #cbd5e1; transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(15,23,42,.15); color: #0f172a; }
  .social svg { width: 17px; height: 17px; }

  .signup { text-align: center; margin-top: 22px; font-size: 13.5px; color: #64748b; }
  .signup a { color: #6366f1; text-decoration: none; font-weight: 650; }
  .signup a:hover { text-decoration: underline; }

  .toast {
    position: fixed; bottom: 34px; left: 50%;
    transform: translate(-50%, 70px);
    z-index: 10;
    background: rgba(15,23,42,.92);
    color: #fff;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    box-shadow: 0 14px 34px rgba(15,23,42,.3);
    transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .4s;
    opacity: 0; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .success {
    position: fixed; inset: 0; z-index: 5;
    display: grid; place-items: center;
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .45s;
  }
  .success.show { opacity: 1; pointer-events: auto; }
  .success .ring {
    width: 76px; height: 76px; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    box-shadow: 0 0 44px -4px rgba(99,102,241,.6);
    transform: scale(0);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
  }
  .success.show .ring { transform: scale(1); }
  .success .ring svg { width: 34px; height: 34px; stroke: #fff; }
  .success p { margin-top: 16px; font-size: 14.5px; font-weight: 650; color: #0f172a; text-align: center; }

  @media (max-width: 880px) {
    .side { display: none; }
    .mobile-brand { display: block; }
    .form-side { min-height: 100vh; }
  }
</style>
</head>
<body>

  <!-- 左栏：品牌 -->
  <aside class="side">
    <div class="ring3"></div>
    <div class="ring4"></div>
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>

    <div class="logo"><span class="mark">N</span>NAUTILO</div>

    <div class="hero">
      <h2>让多个 AI Agent<br>为你协同作战</h2>
      <p>统一管理 Codex、Claude Code、Kimi Code 等编程代理，组建团队、派发任务 DAG，在一个会话里调度它们并肩工作。</p>
    </div>

    <div class="feats">
      <div class="feat"><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>统一会话，多 Agent 协同</div>
      <div class="feat"><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>任务 DAG 编排，自动调度</div>
      <div class="feat"><span class="tick"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>本地优先，数据不出设备</div>
    </div>

    <p class="footnote">© 2026 Nautilo · All rights reserved</p>
  </aside>

  <!-- 右栏：表单 -->
  <section class="form-side">
    <div class="form-box">
      <div class="mobile-brand">
        <div class="mark">N</div>
        <h1 style="font-size:24px">欢迎回来</h1>
      </div>

      <div class="head">
        <h1>欢迎回来 👋</h1>
        <p>登录你的账号，继续你的旅程</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <input id="user" type="text" placeholder="邮箱 / 用户名" autocomplete="username">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>
          </svg>
        </div>

        <div class="field">
          <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <button class="eye" type="button" id="eyeBtn" aria-label="显示密码">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path id="eyeIcon" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="strength" id="strength"><i></i><i></i><i></i><i></i></div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember">
            <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            记住我
          </label>
          <a class="forgot" href="#" onclick="return false">忘记密码？</a>
        </div>

        <button class="btn" type="submit" id="loginBtn">
          <span class="btn-text">登 录</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="divider">或使用以下方式</div>

      <div class="socials">
        <button class="social" type="button" onclick="socialToast('GitHub')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.26 5.66.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
          GitHub
        </button>
        <button class="social" type="button" onclick="socialToast('Google')">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56v-3.1H1.29a12 12 0 0 0 0 10.76l3.98-3.1Z"/><path fill="#EA4335" d="M12 4.76c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.94 1.19 15.23 0 12 0A12 12 0 0 0 1.29 6.62l3.98 3.1C6.22 6.87 8.87 4.76 12 4.76Z"/></svg>
          Google
        </button>
      </div>

      <p class="signup">还没有账号？<a href="#" onclick="return false">立即注册</a></p>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <div class="success" id="successOverlay">
    <div>
      <div class="ring">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p>登录成功，欢迎回来 ✦</p>
    </div>
  </div>

<script>
  const passInput = document.getElementById('pass');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  eyeBtn.addEventListener('click', () => {
    const show = passInput.type === 'password';
    passInput.type = show ? 'text' : 'password';
    eyeIcon.setAttribute('d', show
      ? 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z M4 4l16 16'
      : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z');
  });

  const strength = document.getElementById('strength');
  const colors = ['#f43f5e', '#f59e0b', '#84cc16', '#10b981'];
  passInput.addEventListener('input', () => {
    const v = passInput.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
    strength.classList.toggle('show', v.length > 0);
    const bars = strength.querySelectorAll('i');
    bars.forEach((b, i) => { b.classList.toggle('on', i < score); b.style.color = colors[Math.max(score - 1, 0)]; });
  });

  document.getElementById('loginBtn').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px;`;
    e.currentTarget.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });

  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const overlay = document.getElementById('successOverlay');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pass = passInput.value;
    if (!user) return showToast('请输入邮箱或用户名');
    if (!pass) return showToast('请输入密码');
    if (pass.length < 6) return showToast('密码至少 6 位哦');
    btn.classList.add('loading');
    setTimeout(() => {
      btn.classList.remove('loading');
      overlay.classList.add('show');
      showToast('✦ 登录成功');
      setTimeout(() => {
        overlay.classList.remove('show');
        form.reset();
        strength.classList.remove('show');
        strength.querySelectorAll('i').forEach(i => i.classList.remove('on'));
      }, 2400);
    }, 1300);
  });

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function socialToast(name) { showToast(`${name} 登录即将上线 ✨`); }
</script>
</body>
</html>
