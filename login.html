<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nautilo · 登录</title>
<style>
  :root {
    --bg: #eef1f8;
    --card: rgba(255, 255, 255, 0.72);
    --card-brd: rgba(255, 255, 255, 0.95);
    --ink: #101828;
    --ink-2: #475467;
    --ink-3: #98a2b3;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --ring: rgba(99, 102, 241, 0.14);
    --input-bg: #f2f4f9;
    --input-brd: #e4e7ef;
    --shadow: 0 24px 60px -24px rgba(16, 24, 40, 0.18), 0 2px 8px rgba(16, 24, 40, 0.04);
    --radius: 22px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 背景：柔和网格渐变 ============ */
  .bg { position: fixed; inset: 0; z-index: 0; background: var(--bg); }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .orb.o1 { width: 560px; height: 560px; left: -140px; top: -160px; background: radial-gradient(circle, #c7d2fe, transparent 70%); }
  .orb.o2 { width: 500px; height: 500px; right: -120px; top: 8%; background: radial-gradient(circle, #ffe4f1, transparent 70%); animation-delay: -6s; }
  .orb.o3 { width: 620px; height: 620px; left: 28%; bottom: -260px; background: radial-gradient(circle, #d0f0ff, transparent 70%); animation-delay: -12s; animation-duration: 24s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(50px, -40px) scale(1.08); }
    100% { transform: translate(-40px, 30px) scale(0.96); }
  }

  /* 细点阵装饰 */
  .dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
    background-image: radial-gradient(rgba(16, 24, 40, 0.08) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse at center, transparent 30%, black 100%);
    -webkit-mask-image: radial-gradient(ellipse at center, transparent 30%, black 100%);
  }

  /* ============ 卡片 ============ */
  .shell { position: relative; z-index: 2; width: min(400px, 92vw); }

  .card {
    position: relative;
    background: var(--card);
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    border: 1px solid var(--card-brd);
    border-radius: var(--radius);
    padding: 42px 38px 34px;
    box-shadow: var(--shadow);
    animation: cardIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    overflow: hidden;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(26px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  /* 顶部高光边 */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 8%; right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  /* ============ 头部 ============ */
  .head { text-align: center; margin-bottom: 30px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(99, 102, 241, 0.09);
    border: 1px solid rgba(99, 102, 241, 0.16);
    padding: 5px 12px;
    border-radius: 99px;
    margin-bottom: 18px;
    animation: fadeUp 0.6s 0.05s both;
  }

  .logo {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 26px -8px rgba(99, 102, 241, 0.55), inset 0 1px 0 rgba(255,255,255,0.35);
    animation: fadeUp 0.6s 0.1s both;
  }

  h1 {
    font-size: 24px;
    font-weight: 750;
    letter-spacing: -0.3px;
    animation: fadeUp 0.6s 0.15s both;
  }

  .sub {
    margin-top: 7px;
    font-size: 14px;
    color: var(--ink-2);
    animation: fadeUp 0.6s 0.2s both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ 表单 ============ */
  form { animation: fadeUp 0.6s 0.28s both; }

  .field { position: relative; margin-bottom: 16px; }

  .field input {
    width: 100%;
    height: 50px;
    padding: 0 42px 0 44px;
    font-size: 14.5px;
    color: var(--ink);
    background: var(--input-bg);
    border: 1.5px solid var(--input-brd);
    border-radius: 13px;
    outline: none;
    transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:focus {
    background: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--ring);
  }

  .icon {
    position: absolute;
    left: 15px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    color: var(--ink-3);
    pointer-events: none;
    transition: color 0.22s;
  }
  .field input:focus ~ .icon { color: var(--accent); }

  .eye {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ink-3);
    padding: 8px;
    border-radius: 9px;
    transition: color 0.2s, background 0.2s;
  }
  .eye:hover { color: var(--ink-2); background: rgba(16, 24, 40, 0.05); }

  /* 密码强度（仅在输入时显示） */
  .strength {
    display: flex;
    gap: 5px;
    margin: -8px 2px 16px;
    height: 3px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .strength.show { opacity: 1; }
  .strength i {
    flex: 1;
    border-radius: 99px;
    background: #e7eaf2;
    transition: background 0.3s;
  }
  .strength i.on { background: currentColor; }

  /* 行：记住我 / 忘记密码 */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 2px 0 22px;
    font-size: 13px;
  }
  .check { display: flex; align-items: center; gap: 8px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .check input { display: none; }
  .box {
    width: 17px; height: 17px;
    border-radius: 5.5px;
    border: 1.5px solid #cfd4e0;
    background: #fff;
    display: grid;
    place-items: center;
    transition: all 0.2s;
  }
  .check input:checked + .box {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent;
    box-shadow: 0 3px 10px -2px rgba(99, 102, 241, 0.5);
  }
  .check input:checked + .box svg { opacity: 1; transform: scale(1); }
  .box svg { width: 10px; height: 10px; opacity: 0; transform: scale(0.4); transition: all 0.18s; }
  .forgot { color: var(--accent); text-decoration: none; font-weight: 600; transition: opacity 0.2s; }
  .forgot:hover { opacity: 0.75; }

  /* 主按钮 */
  .btn {
    position: relative;
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 13px;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: 3px;
    color: #fff;
    cursor: pointer;
    overflow: hidden;
    background: linear-gradient(135deg, #1d2939, #101828);
    box-shadow: 0 10px 24px -10px rgba(16, 24, 40, 0.5);
    transition: transform 0.15s, box-shadow 0.3s;
  }
  /* 光晕扫过 */
  .btn::after {
    content: "";
    position: absolute;
    top: 0; left: -80%;
    width: 50%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.18), transparent);
    transform: skewX(-20deg);
    transition: left 0.55s ease;
  }
  .btn:hover { transform: translateY(-1.5px); box-shadow: 0 16px 32px -12px rgba(16, 24, 40, 0.45); }
  .btn:hover::after { left: 130%; }
  .btn:active { transform: translateY(0.5px) scale(0.99); }

  .btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    transform: scale(0);
    animation: ripple 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  .btn.loading { pointer-events: none; }
  .btn .spinner {
    display: none;
    width: 20px; height: 20px;
    margin: 0 auto;
    border: 2.5px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .btn.loading .spinner { display: block; }
  .btn.loading .btn-text { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 分隔线 */
  .divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 24px 0 18px;
    color: var(--ink-3);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e7eaf2;
  }

  /* 社交按钮 */
  .socials { display: flex; gap: 10px; }
  .social {
    flex: 1;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border-radius: 12px;
    background: #fff;
    border: 1.5px solid var(--input-brd);
    cursor: pointer;
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 600;
    transition: all 0.22s;
  }
  .social:hover {
    border-color: #cfd4e0;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -10px rgba(16, 24, 40, 0.18);
    color: var(--ink);
  }
  .social svg { width: 17px; height: 17px; }
  .social svg.github { color: #111827; }

  /* 底部注册 */
  .signup {
    text-align: center;
    margin-top: 22px;
    font-size: 13.5px;
    color: var(--ink-2);
    animation: fadeUp 0.6s 0.4s both;
  }
  .signup a { color: var(--accent); text-decoration: none; font-weight: 650; }
  .signup a:hover { text-decoration: underline; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 34px; left: 50%;
    transform: translate(-50%, 70px);
    z-index: 10;
    background: rgba(16, 24, 40, 0.92);
    color: #fff;
    border-radius: 11px;
    padding: 11px 20px;
    font-size: 13.5px;
    box-shadow: 0 14px 34px rgba(16, 24, 40, 0.3);
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(8px);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  /* 成功覆盖层 */
  .success {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: rgba(238, 241, 248, 0.65);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s;
  }
  .success.show { opacity: 1; pointer-events: auto; }
  .success .ring {
    width: 76px; height: 76px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 40px -4px rgba(99, 102, 241, 0.55);
    transform: scale(0);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .success.show .ring { transform: scale(1); }
  .success .ring svg { width: 34px; height: 34px; stroke: #fff; }
  .success p { margin-top: 16px; font-size: 14.5px; font-weight: 600; color: var(--ink); text-align: center; }

  @media (max-width: 480px) {
    .card { padding: 32px 22px 26px; }
  }
</style>
</head>
<body>

  <!-- 背景 -->
  <div class="bg"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="dots"></div>

  <!-- 登录卡片 -->
  <main class="shell">
    <div class="card">
      <div class="head">
        <span class="badge">✦ 安全 · 快捷 · 本地化</span>
        <div class="logo">N</div>
        <h1>欢迎回来</h1>
        <p class="sub">登录你的账号，继续你的旅程</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <input id="user" type="text" placeholder="邮箱 / 用户名" autocomplete="username">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>
          </svg>
        </div>

        <div class="field">
          <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          </svg>
          <button class="eye" type="button" id="eyeBtn" aria-label="显示密码">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path id="eyeIcon" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="strength" id="strength">
          <i></i><i></i><i></i><i></i>
        </div>

        <div class="row">
          <label class="check">
            <input type="checkbox" id="remember">
            <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            记住我
          </label>
          <a class="forgot" href="#" onclick="return false">忘记密码？</a>
        </div>

        <button class="btn" type="submit" id="loginBtn">
          <span class="btn-text">登 录</span>
          <span class="spinner"></span>
        </button>
      </form>

      <div class="divider">或使用以下方式</div>

      <div class="socials">
        <button class="social" type="button" onclick="socialToast('GitHub')">
          <svg class="github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2.17c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.26 5.66.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
          GitHub
        </button>
        <button class="social" type="button" onclick="socialToast('Google')">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.09 3.57-5.16 3.57-8.81Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.87-3c-1.08.72-2.45 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56v-3.1H1.29a12 12 0 0 0 0 10.76l3.98-3.1Z"/><path fill="#EA4335" d="M12 4.76c1.76 0 3.34.6 4.58 1.79l3.44-3.44C17.94 1.19 15.23 0 12 0A12 12 0 0 0 1.29 6.62l3.98 3.1C6.22 6.87 8.87 4.76 12 4.76Z"/></svg>
          Google
        </button>
      </div>

      <p class="signup">还没有账号？<a href="#" onclick="return false">立即注册</a></p>

      <!-- 成功覆盖层 -->
      <div class="success" id="successOverlay">
        <div>
          <div class="ring">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </div>
          <p>登录成功，欢迎回来 ✦</p>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script>
  /* ========== 密码可见切换 ========== */
  const passInput = document.getElementById('pass');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  eyeBtn.addEventListener('click', () => {
    const show = passInput.type === 'password';
    passInput.type = show ? 'text' : 'password';
    eyeIcon.setAttribute('d', show
      ? 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z M4 4l16 16'
      : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z');
  });

  /* ========== 密码强度 ========== */
  const strength = document.getElementById('strength');
  const colors = ['#f43f5e', '#f59e0b', '#84cc16', '#10b981'];
  passInput.addEventListener('input', () => {
    const v = passInput.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
    if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) score++;
    strength.classList.toggle('show', v.length > 0);
    const bars = strength.querySelectorAll('i');
    bars.forEach((b, i) => {
      b.classList.toggle('on', i < score);
      b.style.color = colors[Math.max(score - 1, 0)];
    });
  });

  /* ========== 按钮波纹 ========== */
  document.getElementById('loginBtn').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px;`;
    e.currentTarget.appendChild(r);
    setTimeout(() => r.remove(), 650);
  });

  /* ========== 登录提交 ========== */
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const overlay = document.getElementById('successOverlay');

  form.addEventListener('submit', e => {
    e.preventDefault();
    const user = document.getElementById('user').value.trim();
    const pass = passInput.value;

    if (!user) return showToast('请输入邮箱或用户名');
    if (!pass) return showToast('请输入密码');
    if (pass.length < 6) return showToast('密码至少 6 位哦');

    btn.classList.add('loading');
    setTimeout(() => {
      btn.classList.remove('loading');
      overlay.classList.add('show');
      showToast('✦ 登录成功，正在跳转…');
      setTimeout(() => {
        overlay.classList.remove('show');
        form.reset();
        strength.classList.remove('show');
        strength.querySelectorAll('i').forEach(i => i.classList.remove('on'));
      }, 2600);
    }, 1300);
  });

  /* ========== Toast ========== */
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }
  function socialToast(name) {
    showToast(`${name} 登录即将上线 ✨`);
  }

  /* ========== 回车聚焦流 ========== */
  document.getElementById('user').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); passInput.focus(); }
  });
</script>
</body>
</html>
