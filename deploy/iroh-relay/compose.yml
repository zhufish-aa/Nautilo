services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "443:8443/tcp"
    volumes:
      - ./relay.toml:/etc/iroh/relay.toml:ro
      # Mount the directory, so atomic certificate renewal is visible inside.
      - ./certs:/etc/iroh/certs:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      RUST_LOG: info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
