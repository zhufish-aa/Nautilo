appId: com.nautilo.desktop
productName: Nautilo
# Explicit: the app package name is the scoped "@agenthub/desktop", which
# sanitizes to an invalid executable name on Linux.
executableName: Nautilo
# Default Linux artifact names embed the scoped package name and produce
# invalid nested paths (release/@agenthub/desktop_*.deb).
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 Nautilo
# pnpm keeps electron in the virtual store, so electron-builder cannot detect
# the version from node_modules — pin it explicitly (keep in sync with
# apps/desktop/package.json).
electronVersion: "33.4.11"

directories:
  app: apps/desktop
  buildResources: apps/desktop/resources
  output: release

# The renderer bundles every npm dependency into out/ via electron-vite, and
# main/preload only use electron + node builtins — node_modules stays out.
files:
  - out/**
  - package.json
  - resources/nautilo-icon-512.png
  - "!node_modules/**"
  # 58 MB of renderer source maps — dev artifacts, not needed at runtime.
  - "!**/*.map"

# Prepared by scripts/prepare-packaged-resources.mjs on the target platform:
# the Rust core daemon (nautilo-core.exe) plus native provider plugins for
# manual install. No node_modules anywhere, so extraResources can carry them
# directly (the old TS daemon needed an afterPack copy to dodge
# electron-builder's node_modules filtering).
extraResources:
  - from: build/packaged/core-daemon
    to: core-daemon
  - from: build/packaged/plugins
    to: plugins

afterPack: scripts/electron-builder-after-pack.cjs

asar: true

# Ship only the locales the UI can display (en/zh); the other ~50 Chromium
# locale paks are ~39 MB of dead weight.
electronLanguages: ["en-US", "zh-CN"]

# electron-builder drafts releases by default; publish them directly.
publish:
  - provider: github
    releaseType: release

win:
  icon: nautilo-icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: Nautilo

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

mac:
  icon: icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  identity: null

linux:
  icon: icon.png
  category: Development
  syncDesktopName: true
  # Required by fpm-based targets (deb/rpm); package.json has no author email.
  maintainer: Nautilo <zhufish-aa@users.noreply.github.com>
  target:
    - AppImage
    - deb
    - rpm

npmRebuild: false
