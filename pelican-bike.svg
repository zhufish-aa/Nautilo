<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfeafa"/>
      <stop offset="100%" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7e3a0"/>
      <stop offset="100%" stop-color="#7ccb74"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 地面 -->
  <rect y="470" width="800" height="30" fill="url(#ground)"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#5aa852" stroke-width="3"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="80" rx="45" ry="20"/>
    <ellipse cx="150" cy="70" rx="35" ry="18"/>
    <ellipse cx="650" cy="100" rx="50" ry="22"/>
    <ellipse cx="690" cy="92" rx="35" ry="16"/>
  </g>

  <!-- 速度线 -->
  <g stroke="#8fb9d9" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="60" y1="300" x2="140" y2="300"/>
    <line x1="30" y1="340" x2="120" y2="340"/>
    <line x1="80" y1="250" x2="150" y2="250"/>
  </g>

  <!-- ===== 自行车 ===== -->
  <g id="bike">
    <!-- 后轮 -->
    <g id="rear-wheel">
      <circle cx="220" cy="400" r="80" fill="none" stroke="#2d3748" stroke-width="10"/>
      <circle cx="220" cy="400" r="70" fill="none" stroke="#4a5568" stroke-width="3"/>
      <g stroke="#4a5568" stroke-width="3">
        <line x1="220" y1="330" x2="220" y2="470"/>
        <line x1="150" y1="400" x2="290" y2="400"/>
        <line x1="171" y1="351" x2="269" y2="449"/>
        <line x1="269" y1="351" x2="171" y2="449"/>
      </g>
      <circle cx="220" cy="400" r="10" fill="#2d3748"/>
    </g>
    <!-- 前轮 -->
    <g id="front-wheel">
      <circle cx="580" cy="400" r="80" fill="none" stroke="#2d3748" stroke-width="10"/>
      <circle cx="580" cy="400" r="70" fill="none" stroke="#4a5568" stroke-width="3"/>
      <g stroke="#4a5568" stroke-width="3">
        <line x1="580" y1="330" x2="580" y2="470"/>
        <line x1="510" y1="400" x2="650" y2="400"/>
        <line x1="531" y1="351" x2="629" y2="449"/>
        <line x1="629" y1="351" x2="531" y2="449"/>
      </g>
      <circle cx="580" cy="400" r="10" fill="#2d3748"/>
    </g>
    <!-- 车架（红色） -->
    <g stroke="#e53e3e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="395" y1="405" x2="220" y2="400"/>
      <line x1="220" y1="400" x2="270" y2="285"/>
      <line x1="270" y1="285" x2="395" y2="405"/>
      <line x1="535" y1="345" x2="270" y2="285"/>
      <line x1="395" y1="405" x2="535" y2="345"/>
      <line x1="535" y1="345" x2="580" y2="400"/>
    </g>
    <!-- 车座 -->
    <rect x="235" y="268" width="70" height="14" rx="7" fill="#2d3748"/>
    <!-- 车把 -->
    <g stroke="#2d3748" stroke-width="6" stroke-linecap="round">
      <line x1="535" y1="345" x2="548" y2="292"/>
      <path d="M 520 288 Q 548 280 576 288" fill="none"/>
    </g>
    <!-- 曲柄与脚蹬 -->
    <g stroke="#2d3748" stroke-width="6" stroke-linecap="round">
      <line x1="395" y1="405" x2="420" y2="448"/>
      <line x1="395" y1="405" x2="370" y2="362"/>
    </g>
    <g fill="#2d3748">
      <rect x="406" y="444" width="30" height="9" rx="4"/>
      <rect x="356" y="358" width="30" height="9" rx="4"/>
    </g>
    <!-- 链条 -->
    <path d="M 395 405 L 220 400" stroke="#718096" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 尾巴 -->
    <path d="M 235 185 Q 198 170 193 143 Q 220 163 245 163 Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>
    <!-- 身体 -->
    <ellipse cx="305" cy="190" rx="80" ry="58" fill="#ffffff" stroke="#cbd5e0" stroke-width="3"/>
    <!-- 翅膀 -->
    <path d="M 300 152 Q 362 160 366 214 Q 332 236 290 220 Z" fill="#f1f5f9" stroke="#cbd5e0" stroke-width="2"/>
    <path d="M 305 176 Q 340 186 350 210" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <path d="M 310 196 Q 336 203 342 221" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <!-- 脖子（粗线描边 + 白芯） -->
    <path d="M 352 168 Q 402 126 416 114" stroke="#cbd5e0" stroke-width="38" stroke-linecap="round" fill="none"/>
    <path d="M 352 168 Q 402 126 416 114" stroke="#ffffff" stroke-width="31" stroke-linecap="round" fill="none"/>
    <!-- 头 -->
    <ellipse cx="428" cy="102" rx="24" ry="20" fill="#ffffff" stroke="#cbd5e0" stroke-width="3"/>
    <!-- 眼睛 -->
    <circle cx="437" cy="95" r="4.5" fill="#1a202c"/>
    <circle cx="438.5" cy="93.5" r="1.6" fill="#ffffff"/>
    <!-- 上喙 -->
    <path d="M 448 100 Q 500 87 545 104 L 545 116 Q 495 108 446 112 Z" fill="#f6ad55" stroke="#dd6b20" stroke-width="2"/>
    <!-- 大喉囊 -->
    <path d="M 446 112 Q 462 162 505 146 Q 522 130 545 116 Z" fill="#ed8936" stroke="#dd6b20" stroke-width="2"/>
    <!-- 喉囊里的小鱼（彩蛋） -->
    <path d="M 478 133 Q 488 127 497 134 Q 490 141 480 139 Z" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1.5"/>
    <polygon points="497,131 506,134 497,138" fill="#63b3ed" stroke="#2b6cb0" stroke-width="1"/>
    <circle cx="484" cy="133" r="1" fill="#1a202c"/>
    <!-- 腿（踩脚踏板） -->
    <g stroke="#ed8936" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="330" y1="240" x2="420" y2="448"/>
      <line x1="290" y1="236" x2="370" y2="362"/>
    </g>
  </g>
</svg>
