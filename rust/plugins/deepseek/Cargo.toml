[package]
name = "agenthub-plugin-deepseek"
version = "0.1.0"
edition = "2021"
description = "DeepSeek Harness native runtime integration for Nautilo"

[dependencies]
agenthub-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
