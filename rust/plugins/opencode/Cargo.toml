[package]
name = "agenthub-plugin-opencode"
version = "0.1.0"
edition = "2021"
description = "Nautilo native provider plugin for OpenCode (server API + headless run)"

[dependencies]
agenthub-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
