[package]
name = "agenthub-plugin-antigravity"
version = "0.2.15"
edition = "2021"
license = "MIT"
description = "Google Antigravity ACP provider for Nautilo"

[dependencies]
agenthub-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
