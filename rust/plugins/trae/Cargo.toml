[package]
name = "agenthub-plugin-trae"
version = "0.1.0"
edition = "2021"
description = "Nautilo native provider plugin for Trae (traecli ACP / trae-agent CLI)"

[dependencies]
agenthub-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
regex = "1"
