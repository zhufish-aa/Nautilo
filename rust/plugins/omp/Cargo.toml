[package]
name = "agenthub-plugin-omp"
version = "0.1.0"
edition = "2021"
description = "Nautilo native provider plugin for Oh My Pi (omp, JSONL RPC)"

[dependencies]
agenthub-plugin-sdk = { path = "../../plugin-sdk" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
