[package]
name = "agenthub-plugin-sdk"
version = "0.1.0"
edition = "2021"
description = "Native provider plugin SDK for Nautilo (subprocess wire protocol)"
license = "MIT"

[lib]
name = "agenthub_plugin_sdk"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
