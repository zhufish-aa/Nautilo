    $("wires").append(svg("line",{...pts,class:"align-guide"}));
  }
}
function transformWorld(){
  $("world").style.transform="translate("+pan.x+"px,"+pan.y+"px) scale("+scale+")";
  $("zoom-value").textContent=Math.round(scale*100)+"%";
  $("zoom-out").disabled=scale<=.30;$("zoom-in").disabled=scale>=2;
}
function fit(){
  const b=$("board");const sw=b.clientWidth,sh=b.clientHeight;if(!sw||!sh)return;
  const minX=Math.min(...Object.values(views).map(v=>v.x))-14,maxX=Math.max(...Object.values(views).map(v=>v.x+v.w))+14;
  const minY=Math.min(views.code.y-38,views.trace.y-38,...Object.values(views).map(v=>v.y))-6, maxY=Math.max(390,...Object.values(views).map(v=>v.y+v.h+39));
  scale=Math.max(.30,Math.min(1.4,(sw-26)/(maxX-minX),(sh-45)/(maxY-minY)));
  pan.x=(sw-(maxX-minX)*scale)/2-minX*scale;pan.y=(sh-30-(maxY-minY)*scale)/2-minY*scale;
  transformWorld();manuallyFramed=false;
}
function resizeBoard(){
  const b=$("board"),next=b.clientWidth<620?"portrait":"wide";
  if(next!==orientation){
    layouts[orientation]=positions();orientation=next;W=next==="wide"?1070:545;H=next==="wide"?490:575;
    for(const [id,[x,y]] of Object.entries(layouts[next])){views[id].x=x;views[id].y=y;}
    Object.assign($("world").style,{width:W+"px",height:H+"px"});
    Object.assign($("wires").style,{width:W+"px",height:H+"px"});
    const snap=mode==="run"?stateAt(step):null;drawWires(snap);showCards(snap);manuallyFramed=false;
  }
  b.dataset.layout=orientation;if(!manuallyFramed)fit();
  $("undo-layout").hidden=mode!=="design"||!layoutHistory[orientation].length;
}
function zoom(factor){
  const b=$("board"),x=b.clientWidth/2,y=b.clientHeight/2,next=Math.min(2,Math.max(.30,scale*factor));
  pan={x:x-(x-pan.x)*next/scale,y:y-(y-pan.y)*next/scale};scale=next;manuallyFramed=true;transformWorld();
}


function promptReading(n){
  const names={"input.question":"任务问题",incoming:"上游证据","incoming.summary":"上游结论"};
  return n.prompt.split(/(\{\{\s*[^{}]+?\s*\}\})/g).map(part=>{
    const binding=part.match(/^\{\{\s*([^{}]*?)\s*\}\}$/);
    if(!binding)return escapeHtml(part);
    const key=binding[1],port=key.startsWith("exit.")&&n.exits.find(e=>e.id===key.slice(5));
    return '<span class="binding'+(port?' outcome':'')+'" title="'+escapeHtml(part)+'">'+escapeHtml(port?port.name:names[key]||key)+'</span>';
  }).join("");
}
function renderedPrompt(id,snap){
  const n=findNode(run.def,id);
  const received=id==="verify" ? snap.notes.synth : (snap.visits.synth>1 && id==="synth" ? [snap.notes.code,snap.notes.trace,snap.notes.verify].filter(Boolean).join("；") : [snap.notes.code,snap.notes.trace].filter(Boolean).join("；"));
  return n.prompt.replace(/\{\{\s*([\w.]+)\s*\}\}/g,(match,key)=>{
    if(key==="input.question")return run.question;
    if(key==="incoming" || key==="incoming.summary")return received||"待上游证据";
    if(key.startsWith("exit.")){const p=n.exits.find(p=>p.id===key.slice(5));if(p)return p.name;}
    return match;
  });
}
function facts(pairs) {
  return '<dl class="facts">'+pairs.map(([a,b])=>'<div><dt>'+escapeHtml(a)+'</dt><dd>'+escapeHtml(b)+'</dd></div>').join("")+'</dl>';
}
function section(label,contents) {return '<section class="field"><h3>'+escapeHtml(label)+'</h3>'+contents+'</section>';}
const controlDescriptions={
  main:"使用当前主会话，同时派发代码探索和时序探索。两名 Agent 接收各自的任务提示词。",
  join:"等待同一批次的两份证据。两份都收到后，合并结果并唤起综合判断。",
  "$return":"把具名出口、结论和证据交回发起任务的主会话，本次流程随后结束。"
};
function showInspector(){
  const v=views[picked],n=findNode(model(),picked),agent=n?.kind==="agent",edit=mode==="design";
  const snap=edit?null:stateAt(step),state=snap?.states[picked]||"idle";
  $("inspector-title").textContent=edit?"节点属性":"本轮执行";
  $("inspector-kind").textContent=agent?"Agent":n?.kind==="main"?"调用方":"控制节点";
  $("node-picker").value=picked;
  const identity='<div class="identity" style="--tint:var(--'+v.color+')"><div class="identity-icon">'+icon(v.icon)+'</div><div><h2>'+v.name+'</h2><p>'+v.role+'</p></div></div>';
  let left=identity,middle="",right="";
  if(edit){
    const inputs=model().edges.filter(e=>e.to===picked).length,outputs=n?.exits.length||0;
    left+='<div class="dock-metrics"><span>'+inputs+' 条入线</span><i></i><span>'+outputs+' 个出口</span></div>';
  }
  if(!edit){
    const rows=[["执行轮次",String(snap.visits[picked]||"—")]];
    if(picked==="join")rows.push(["已收证据",(Number(!!snap.receipts.code)+Number(!!snap.receipts.trace))+" / 2"]);
    if(picked==="trace" && ["repair","escalate"].includes(run.route))rows.push(["主动提醒",snap.messages.length?"1 次":"0 次"]);
    left+='<div class="field"><div class="run-state '+(state==="decision"?"waiting":state)+'">'+icon(stateIcons[state])+'<b>'+stateLabels[state]+'</b></div>'+facts(rows)+'</div>';
    left+='<button id="follow-btn" class="quiet" aria-pressed="'+following+'">'+icon(following?"check":"fit")+"跟随当前节点"+'</button>';
  }
  if(agent && edit){
    middle='<section class="field"><div class="field-heading"><label class="title" for="prompt">任务提示词</label><button id="prompt-finish" type="button" hidden>完成</button></div><button id="prompt-reading" class="prompt-paper" type="button" aria-label="编辑任务提示词">'+promptReading(n)+icon("design")+'</button><textarea id="prompt" aria-label="任务提示词" rows="3" maxlength="3600" spellcheck="false" hidden></textarea></section>';
  }else if(agent){
    middle=section(snap.prompts[picked]?"实际派发的提示词":"计划提示词",'<p style="white-space:pre-wrap">'+escapeHtml(snap.prompts[picked]||n.prompt)+'</p>');
  }else middle=section("执行规则",'<p>'+controlDescriptions[picked]+'</p>');
  if(n?.exits.length){
    const rows=n.exits.map(p=>{
      const e=model().edges.find(e=>e.from[0]===picked && e.from[1]===p.id);
      const label=edit?'<input aria-label="'+escapeHtml(p.name)+'的出口名称" data-exit="'+p.id+'" maxlength="24" value="'+escapeHtml(p.name)+'">':'<span class="label">'+escapeHtml(p.name)+'</span>';
      return '<div class="outlet" data-port="'+p.id+'" style="--tint:var(--'+v.color+')">'+(snap?.receipts[picked]===p.id?icon("check"):'<b class="port-mark"></b>')+label+'<button class="route-target" type="button" data-go="'+e.to+'" title="在画布上定位'+escapeHtml(views[e.to].name)+'">'+icon("chev")+escapeHtml(views[e.to].name)+'</button></div>';
    }).join("");
    right+=section("命名出口",rows);
  }
  if(!edit && snap.notes[picked] && state!=="active")right+=section("本次结果",'<p>'+escapeHtml(snap.notes[picked])+'</p>');
  if(!edit && state==="waiting")right+=section("待补交",'<p>引擎正在等候原子会话提交出口和结果。</p>');
  if(edit && picked==="synth")right+='<p class="fine" style="font-size:11px;color:var(--muted);margin-top:5px">独立复核最多回流 2 次</p>';
  if(!right)right=section("交付位置","<p>原主会话 · 返回出口和证据</p>");
  const body=$("inspector");body.innerHTML=[left,middle,right].map(html=>'<div class="dock-unit">'+html+'</div>').join("");
  body.querySelectorAll(".route-target").forEach(b=>{b.onclick=()=>{const id=b.dataset.go;locateNode(id);cardFor(id).focus({preventScroll:true});};});
  if(edit)body.querySelectorAll("[data-port]").forEach(row=>{
    row.onpointerenter=()=>traceLinks(picked,row.dataset.port);row.onpointerleave=()=>traceLinks(picked);
    row.onfocusin=()=>traceLinks(picked,row.dataset.port);row.onfocusout=()=>traceLinks(picked);
  });
  if(edit && agent){
    const input=$("prompt"),reading=$("prompt-reading"),finish=$("prompt-finish");let original=n.prompt;
    input.value=n.prompt;
    function endEdit(focus){
      if(input.hidden)return;
      reading.innerHTML=promptReading(n)+icon("design");reading.hidden=false;input.hidden=true;finish.hidden=true;
      if(focus)reading.focus();
    }
    reading.onclick=()=>{original=n.prompt;reading.hidden=true;input.hidden=false;finish.hidden=false;input.focus();};
    finish.onclick=()=>endEdit(true);
    input.oninput=()=>{n.prompt=input.value;input.setCustomValidity("");saveDraft();};
    input.onkeydown=e=>{if(e.key==="Escape"||(e.key==="Enter"&&(e.ctrlKey||e.metaKey))){e.preventDefault();if(e.key==="Escape"){n.prompt=input.value=original;saveDraft();}endEdit(true);}};
    input.onblur=e=>{if(e.relatedTarget!==finish)endEdit(false);};
  }
  if(edit)body.querySelectorAll("[data-exit]").forEach(input=>{
    const port=n.exits.find(p=>p.id===input.dataset.exit);
    input.addEventListener("change",()=>{
      const name=input.value.trim();
      if(!name || n.exits.some(p=>p!==port&&p.name===name)){
        input.value=port.name;$("draft").textContent=name?"同一节点的出口须有不同名称":"出口名称不能为空";return;
      }
      port.name=name;input.value=name;input.setAttribute("aria-label",name+"的出口名称");
      if($("prompt-reading"))$("prompt-reading").innerHTML=promptReading(n)+icon("design");
      saveDraft();drawWires(null);
    });
    input.addEventListener("keydown",e=>{if(e.key==="Enter")input.blur();});
  });
  const followBtn=$("follow-btn");if(followBtn)followBtn.onclick=()=>{following=!following;if(following)picked=run.events[step].focus;draw();};
}
function showMessages(snap) {
  const messages=snap?.messages||[];const latest=messages.at(-1);
  $("messages-open").hidden=!latest;$("message-count").textContent=String(messages.length);
  $("messages-open").setAttribute("aria-label","查看会话消息，"+messages.length+" 条");
  const box=$("notice");
  const message=mode==="run"?run.events[step].message:null;
  box.hidden=!message || dismissedNotice===message.id;
  if(!box.hidden) {
    box.innerHTML='<div class="notice-head">'+icon("alert")+'<b>引擎 → '+escapeHtml(message.to)+'</b><span>已推送</span><button aria-label="收起消息">'+icon("close")+'</button></div><p>'+escapeHtml(message.body)+'</p>';
    box.querySelector("button").onclick=()=>{dismissedNotice=message.id;box.hidden=true;};
  }
  $("inbox-content").innerHTML=messages.map(m=>{
    const delivery=m.id==="escalate-main"?"已推送 · 等待主 Agent 判断":snap.receipts.trace?"子 Agent 已补交":snap.states.trace==="failed"?"补交超时 · 已升级":"已推送 · 等待补交";
    return '<article><header>'+icon("alert")+'<b>引擎 → '+escapeHtml(m.to)+'</b><span>'+escapeHtml(m.channel)+'</span><time>'+clock(m.sec)+'</time></header><p><strong>'+escapeHtml(m.title)+'</strong></p><p>'+escapeHtml(m.body)+'</p><small>'+delivery+'</small></article>';
  }).join("");
}

function updatePlaybackControls(){
  $("play").innerHTML=icon(playing?"pause":"play")+"<span>"+(mode==="design"?"试运行":playing?"暂停":step===0?"播放":step===run.events.length-1?"再播一次":"继续播放")+"</span>";
}
function draw(){
  const editing=mode==="design",snap=editing?null:stateAt(step);
  document.body.dataset.mode=mode;
  document.body.dataset.playing=String(playing);
  $("design-tab").setAttribute("aria-pressed",String(editing));$("run-tab").setAttribute("aria-pressed",String(!editing));
  $("route-wrap").hidden=editing;$("draft").hidden=!editing;$("design-foot").hidden=!editing;$("run-foot").hidden=editing;
  $("task-line").textContent=editing?(question||"填写本次任务问题"):run.question;
  $("canvas-title").textContent=editing?"流程画布":"执行现场";
  $("canvas-meta").textContent=editing?"6 个节点 · 8 条连接":(step===run.events.length-1?(snap.states.$return==="decision"?"需主 Agent 判断":"已完成"):(playing?"播放中":"回放已暂停"));
  if(!editing && following)picked=run.events[step].focus;
  drawWires(snap);showCards(snap);showInspector();showMessages(snap);
  if(!editing){
    $("prev").disabled=step===0;$("next").disabled=step===run.events.length-1;$("step-count").textContent=(step+1)+" / "+run.events.length;
    $("event-time").textContent=clock(run.events[step].sec);$("event-text").textContent=run.events[step].text;
    const track=$("track");if(track.childElementCount!==run.events.length)track.replaceChildren();
    run.events.forEach((e,i)=>{
      let b=track.children[i];if(!b){b=document.createElement("button");b.type="button";b.onclick=()=>seek(i);track.append(b);}
      b.className=i<step?"past":"";if(i===step)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");
      b.textContent=e.stage;b.dataset.notice=String(!!e.message);
      b.title=clock(e.sec)+" · "+e.text;b.setAttribute("aria-label",b.title);
    });
  }
  $("hint-text").textContent=editing?"拖动节点自动对齐，按 Alt 自由移动。点击出口右侧的节点名可定位下游。":"示例事件回放 · 点击时间线定位，选中节点可查看本轮提示词与回执。";
  $("overview-count").textContent=editing?"4 个 Agent 节点 · 1 处回流":"回放速度与示例事件时间独立";
  $("undo-layout").hidden=!editing || !layoutHistory[orientation].length;
  updatePlaybackControls();rememberView();
}
function validate(){
  if(!question.trim()){ $("question").setCustomValidity("请输入本次问题");$("question").reportValidity();return false;}
  for(const n of draft.nodes.filter(n=>n.kind==="agent")){
    if(!n.prompt.trim()){choose(n.id);$("prompt-reading").click();const p=$("prompt");p.setCustomValidity("启动前需要给这个节点准备任务提示词");p.reportValidity();return false;}
    for(const token of n.prompt.matchAll(/\{\{\s*([^{}]*?)\s*\}\}/g)){
      const path=token[1];
      const allowed=path==="input.question" || ((n.id==="synth"||n.id==="verify") && (path==="incoming"||path==="incoming.summary")) || n.exits.some(p=>path==="exit."+p.id);
      if(!allowed){choose(n.id);$("prompt-reading").click();const p=$("prompt");p.setCustomValidity("此节点没有绑定变量 "+token[0]);p.reportValidity();return false;}
    }
  }
  return true;
}
function pause(){
  elapsedFlow=flowTime();flowOrigin=null;playing=false;window.clearTimeout(timer);timer=0;
  motions.forEach(a=>a.pause());
}
function seek(index){
  if(!run)return;pause();step=Math.max(0,Math.min(run.events.length-1,index));draw();
}
function play(){
  if(mode==="design"){
    if(!validate())return;
    makeRun();mode="run";
  }
  if(playing){pause();draw();return;}
  if(step===run.events.length-1)step=0;
  flowOrigin=performance.now();playing=true;draw();
  function tick(){
    if(!playing)return;
    step++;if(step>=run.events.length-1){step=run.events.length-1;pause();}
    draw();run.events[step].edges.forEach(signalArrival);if(playing)timer=window.setTimeout(tick,run.events[step].message?3400:2200);
  }
  timer=window.setTimeout(tick,1150);
}
function setMode(next){
  if(next===mode)return;
  if(next==="run"&&!run){if(!validate())return;makeRun();}
  pause();mode=next;draw();
}
function bindControls(){
  document.addEventListener("pointerdown",()=>{document.body.dataset.input="pointer";},{capture:true});
  document.addEventListener("keydown",()=>{document.body.dataset.input="keyboard";},{capture:true});
  $("undo-layout").onclick=undoMove;
  for(const [id,v] of Object.entries(views))$("node-picker").add(new Option(v.name,id));
  $("node-picker").onchange=e=>locateNode(e.target.value);
  $("messages-open").onclick=()=>{if(playing){pause();draw();}$("inbox").showModal();};
  $("close-inbox").onclick=()=>$("inbox").close();
  $("design-tab").onclick=()=>setMode("design");$("run-tab").onclick=()=>setMode("run");$("play").onclick=play;
  $("scenario").onchange=()=>{pause();makeRun();draw();};
  $("next").onclick=()=>seek(step+1);$("prev").onclick=()=>seek(step-1);$("replay").onclick=()=>{pause();step=0;following=true;play();};
  $("fit").onclick=fit;$("zoom-out").onclick=()=>zoom(1/1.2);$("zoom-in").onclick=()=>zoom(1.2);
  $("question").value=question;$("question").oninput=e=>{question=e.target.value;e.target.setCustomValidity("");$("task-line").textContent=question||"填写本次任务问题";saveDraft();};
  function themeLabel(){$("theme").setAttribute("aria-label",document.documentElement.dataset.theme==="dark"?"切换浅色主题":"切换深色主题");}
  themeLabel();$("theme").onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";themeLabel();saveDraft();};
  $("open-json").onclick=()=>{if(playing){pause();draw();}$("json-output").textContent=JSON.stringify(model(),null,2);$("copy").querySelector("span").textContent="复制 JSON";$("json-dialog").showModal();};
  $("dismiss").onclick=()=>$("json-dialog").close();
  $("json-dialog").onclick=e=>{if(e.target===$("json-dialog")){const r=$("json-dialog").getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$("json-dialog").close();}};
  $("copy").onclick=async()=>{
    let copied=false;
    try{await navigator.clipboard.writeText($("json-output").textContent);copied=true;}catch{
      const range=document.createRange();range.selectNodeContents($("json-output"));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);
      try{copied=document.execCommand("copy");}catch{}
    }
    $("copy").querySelector("span").textContent=copied?"已复制":"已选中，可手动复制";
  };
  const board=$("board");
  board.onpointerdown=e=>{
    if(e.button!==0 || !e.isPrimary || e.target.closest(".zoom"))return;
    const node=e.target.closest(".node");
    if(node && mode==="run") return;
    if(node){choose(node.dataset.id);node.focus({preventScroll:true});}
    drag={id:node?.dataset.id, pointer:e.pointerId, screenX:e.clientX, screenY:e.clientY,
      x:node?views[node.dataset.id].x:pan.x,y:node?views[node.dataset.id].y:pan.y, moved:false};
    board.setPointerCapture(e.pointerId);
  };
  board.onpointermove=e=>{
    if(!drag||e.pointerId!==drag.pointer)return;
    const dx=e.clientX-drag.screenX,dy=e.clientY-drag.screenY;
    if(!drag.moved && Math.abs(dx)+Math.abs(dy)<3)return;
    drag.moved=true;
    if(drag.id)dragNode(drag.id,drag.x+dx/scale,drag.y+dy/scale,!e.altKey);
    else{pan={x:drag.x+dx,y:drag.y+dy};manuallyFramed=true;board.classList.add("panning");transformWorld();}
  };
  function endDrag(e){
    if(!drag||e.pointerId!==drag.pointer)return;
    if(drag.id && drag.moved){
      if(e.type==="pointercancel")move(drag.id,drag.x,drag.y);
      else recordMove({id:drag.id,x:drag.x,y:drag.y});
      board.querySelectorAll(".align-guide").forEach(line=>line.remove());saveDraft();
    }
    drag=null;board.classList.remove("panning");
    if(board.hasPointerCapture(e.pointerId))board.releasePointerCapture(e.pointerId);
  }
  board.onpointerup=endDrag;board.onpointercancel=endDrag;board.onlostpointercapture=endDrag;
  board.addEventListener("keydown",e=>{
    if(mode==="design"&&(e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"){
      e.preventDefault();undoMove();
    }else if(e.key==="Escape"&&drag){
      const old=drag;drag=null;if(old.id)move(old.id,old.x,old.y);else{pan={x:old.x,y:old.y};transformWorld();}
      board.classList.remove("panning");if(board.hasPointerCapture(old.pointer))board.releasePointerCapture(old.pointer);
    }
  });
  board.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1);}},{passive:false});
  new ResizeObserver(resizeBoard).observe(board);
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing){pause();draw();}});
  reduced.addEventListener("change",()=>drawWires(mode==="run"?stateAt(step):null));
}
loadDraft();setupCards();bindControls();restoreView();
const requestedDemo=new URLSearchParams(location.search).get("demo");
const restoringReplay=performance.getEntriesByType("navigation")[0]?.type==="reload" && !!run;
if(!restoringReplay && (requestedDemo==="reminder" || requestedDemo==="parallel")){
  const route=requestedDemo==="reminder"?"escalate":"conflict",def=clone(seed);
  run={route,def,question:initialQuestion,events:makeEvents(def,route)};$("scenario").value=route;mode="run";following=true;
  step=requestedDemo==="reminder"?run.events.findIndex(e=>e.message):1;
}
$("draft").textContent="本机草稿";draw();resizeBoard();
if(!restoringReplay&&requestedDemo==="parallel"&&!reduced.matches&&!document.hidden)play();
</script>
