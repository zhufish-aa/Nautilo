name: Release

on:
  push:
    tags: ["v*", "build-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} (Electron + Rust)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            builder: win
            arch: x64
            rust-target: x86_64-pc-windows-gnu
          - platform: darwin-x64
            runner: macos-15-intel
            builder: mac
            arch: x64
            rust-target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            builder: mac
            arch: arm64
            rust-target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            builder: linux
            arch: x64
            rust-target: x86_64-unknown-linux-gnu
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RUSTUP_TOOLCHAIN: stable
      NAUTILO_RUST_TARGET: ${{ matrix.rust-target }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.rust-target }} --toolchain stable
      - name: Set up Windows linker
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'
      - name: Set up Linux packaging
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop
        run: pnpm build:desktop
      - name: Build native backend and plugins
        run: node scripts/prepare-packaged-resources.mjs build/packaged
      - name: Package native marketplace plugins
        run: node scripts/package-native-plugins.mjs
      - name: Build application packages
        run: pnpm exec electron-builder --${{ matrix.builder }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nautilo-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
          path: |
            release/Nautilo-*.exe
            release/Nautilo-*.zip
            release/Nautilo-*.dmg
            release/Nautilo-*.AppImage
            release/Nautilo-*.deb
            release/Nautilo-*.rpm
            release/nautilo-plugin-*.tgz
            release/plugins-*.json

  publish:
    name: Publish installers and native plugins
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: nautilo-*
          path: release
          merge-multiple: true
      - name: Verify plugins and assemble checksums
        run: node scripts/assemble-release.mjs
      - name: Read release version
        id: version
        run: node -e "console.log('tag=v' + require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nautilo-marketplace-index
          path: |
            release/plugins-registry.json
            release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Nautilo ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Nautilo-*.exe
            release/Nautilo-*.zip
            release/Nautilo-*.dmg
            release/Nautilo-*.AppImage
            release/Nautilo-*.deb
            release/Nautilo-*.rpm
            release/nautilo-plugin-*.tgz
            release/plugins-registry.json
            release/SHA256SUMS.txt
