name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, platform: win }
          - { name: macOS arm64, os: macos-latest, platform: mac }
          - { name: macOS x64, os: macos-15-intel, platform: mac }
          - { name: Linux x64, os: ubuntu-latest, platform: linux }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build desktop app and daemon
        run: pnpm build:desktop

      - name: Prepare packaged resources (daemon deps + Node runtime)
        run: node scripts/prepare-packaged-resources.mjs build/packaged

      - name: Build and publish packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish always
