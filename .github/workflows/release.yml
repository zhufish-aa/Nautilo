name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain and MinGW linker
        # rust-toolchain.toml pins stable-x86_64-pc-windows-gnu (rust/ and
        # apps/desktop/src-tauri/); the gnu target needs a gcc linker, which
        # the runner image ships via MSYS2.
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri portable package
        # The renderer bundle (monaco, diff editor, xlsx, pdfjs) exceeds the
        # default 2 GB V8 heap on CI runners.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/package-win-tauri.mjs --build

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Nautilo-win32-x64*.zip
